server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Batas upload attachment (image compression base64)
    client_max_body_size 20m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse proxy /api ke backend container
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Pertahankan cookies auth (httpOnly)
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Cache aset statis
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — semua route non-api dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
